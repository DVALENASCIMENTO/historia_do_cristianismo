<style>

<body>
<header>
<h1>História do Cristianismo</h1>
<p class="subtitle">Pedro, apóstolo · Discípulo de Jesus e testemunha da ressurreição</p>
</header>
<main>
<div class="stage"><article class="book" id="book" aria-live="polite">
<p class="page-kicker" id="kicker"></p><h2 class="page-title" id="pageTitle"></h2><div class="page-body" id="pageBody"></div><div class="page-number" id="pageNumber"></div>
</article></div>

</div>
<section class="reader"><h2>Leitor de voz e texto da página</h2><p id="pageText"></p></section>
<p class="hint">Deslize para a esquerda ou direita no celular para virar as páginas. A leitura em voz alta usa a voz disponível no navegador ou aparelho.</p>
</main>
<script>
const pages = [
{
kicker:"História do Cristianismo",
title:"Pedro, apóstolo",
body:`Simão Pedro foi um dos discípulos mais destacados de Jesus e uma das figuras centrais da Igreja Primitiva.

Natural da Galileia e pescador de profissão, Simão foi chamado por Jesus para segui-lo. O Mestre lhe deu o nome de Cefas, traduzido como Pedro, e o preparou para participar da missão de anunciar o Reino de Deus.

Os Evangelhos mostram Pedro como um homem de fé e coragem, mas também alguém que enfrentou dúvidas, impulsividade e fracasso. Sua trajetória evidencia o chamado, a correção e a restauração que marcaram seu discipulado.`,
verse:"“E tu és Pedro, e sobre esta pedra edificarei a minha igreja.” — Mateus 16:18"
},
{
kicker:"1. Identificação e contexto",
title:"Quem foi Simão Pedro?",
body:`Pedro também é chamado Simão, filho de Jonas ou João, conforme a passagem e a tradução bíblica. O nome Cefas vem do aramaico e corresponde a Pedro, relacionado à ideia de pedra.

Ele era irmão de André e trabalhava como pescador na região do mar da Galileia. Os relatos bíblicos situam sua vida no contexto judaico do século I, sob o domínio romano.

O Novo Testamento não informa a data exata de seu nascimento. Por isso, é mais seguro situá-lo no século I e concentrar a biografia nos acontecimentos registrados nas Escrituras.`,
verse:"Leitura principal: Mateus 4:18–20; João 1:40–42."
},
{
kicker:"2. O chamado de Jesus",
title:"De pescador a discípulo",
body:`Os Evangelhos de Mateus e Marcos relatam que Jesus chamou Simão e André enquanto lançavam redes ao mar. Jesus prometeu fazer deles pescadores de homens, e os dois deixaram as redes para segui-lo.

Lucas apresenta uma pesca extraordinária associada ao chamado de Simão. Diante do acontecimento, Pedro reconheceu sua própria indignidade, mas Jesus o chamou para uma nova missão.

O chamado não significou que Pedro já fosse perfeito. Ele começou uma caminhada de convivência com Jesus, aprendizado e transformação.`,
verse:"“Vinde após mim, e eu vos farei pescadores de homens.” — Mateus 4:19"
},
{
kicker:"3. Pedro entre os Doze",
title:"Um dos discípulos mais próximos",
body:`Pedro integrou o grupo dos doze apóstolos e aparece com frequência entre os discípulos que acompanharam Jesus em ocasiões importantes. Junto com Tiago e João, esteve presente em episódios como a transfiguração.

Sua personalidade é apresentada de modo direto nos Evangelhos. Pedro fazia perguntas, respondia em nome dos discípulos e, por vezes, falava antes de compreender plenamente o significado das palavras de Jesus.

Esses relatos não escondem suas limitações. Ao mostrar seus acertos e erros, os textos apresentam um discípulo real, formado durante o ministério de Cristo.`,
verse:"Leitura: Marcos 3:13–19; Marcos 9:2–8."
},
{
kicker:"4. A confissão de fé",
title:"“Tu és o Cristo”",
body:`Em Cesareia de Filipe, Jesus perguntou aos discípulos quem eles diziam que ele era. Pedro respondeu que Jesus era o Cristo, o Filho do Deus vivo.

Jesus declarou que essa compreensão lhe fora revelada pelo Pai. Na sequência, falou sobre a edificação de sua igreja e confiou a Pedro uma responsabilidade expressa por meio da imagem das chaves do Reino.

As tradições cristãs interpretam essa passagem de maneiras diferentes, especialmente quanto ao significado da pedra e ao papel de Pedro. O próprio texto deve ser lido em seu contexto, considerando a confissão sobre a identidade de Jesus.`,
verse:"“Tu és o Cristo, o Filho do Deus vivo.” — Mateus 16:16"
},
{
kicker:"5. Fé e fragilidade",
title:"Quando Pedro afundou",
body:`Mateus relata que Pedro saiu do barco e caminhou sobre as águas em direção a Jesus. Ao perceber a força do vento, teve medo e começou a afundar, clamando por socorro. Jesus estendeu a mão e o segurou.

O episódio combina confiança e fragilidade. Pedro deu um passo em resposta à palavra de Jesus, mas o medo tomou conta dele. O relato dirige a atenção para a autoridade de Cristo e para a necessidade de confiar nele.

A passagem não deve ser reduzida a uma fórmula de sucesso pessoal. Ela apresenta Jesus como aquele que socorre seu discípulo em meio à fraqueza.`,
verse:"“Senhor, salva-me!” — Mateus 14:30"
},
{
kicker:"6. A advertência de Jesus",
title:"O caminho da cruz",
body:`Depois da confissão de Pedro, Jesus começou a explicar que sofreria, morreria e ressuscitaria. Pedro reagiu, tentando afastar essa perspectiva, e foi severamente corrigido por Jesus.

O episódio revela que reconhecer Jesus como o Cristo não significava compreender imediatamente a natureza de sua missão. Pedro ainda precisava aprender que o caminho de Jesus passava pelo sofrimento e pela entrega.

Jesus ensinou aos discípulos que segui-lo exigia negar a si mesmos, tomar a cruz e acompanhá-lo. O discipulado não poderia ser separado da obediência à vontade de Deus.`,
verse:"Leitura: Mateus 16:21–25."
},
{
kicker:"7. A negação anunciada",
title:"A confiança de Pedro é provada",
body:`Na última ceia, Pedro afirmou que estava disposto a acompanhar Jesus até a prisão e à morte. Jesus, porém, anunciou que Pedro o negaria três vezes antes que o galo cantasse.

Pedro acreditava ser mais firme do que realmente era. A narrativa mostra a distância entre a intenção sincera e a capacidade de permanecer fiel em uma situação de medo e perigo.

A advertência de Jesus também preparou o caminho para a restauração. A falha de Pedro foi grave, mas não seria o fim de sua história como discípulo.`,
verse:"Leitura: Lucas 22:31–34; João 13:36–38."
},
{
kicker:"8. A negação de Jesus",
title:"O choro amargo",
body:`Durante a prisão e o julgamento de Jesus, Pedro ficou no pátio do sumo sacerdote. Questionado por pessoas que o reconheceram como seguidor de Jesus, negou conhecê-lo três vezes.

Depois do canto do galo, Pedro se lembrou da palavra de Jesus e chorou amargamente. Lucas registra que Jesus olhou para Pedro, e esse momento levou o discípulo a recordar o anúncio que recebera.

Os Evangelhos não escondem esse fracasso. A negação serve de advertência contra a autoconfiança e mostra a profundidade da crise vivida por Pedro durante a paixão de Jesus.`,
verse:"“E, saindo Pedro para fora, chorou amargamente.” — Lucas 22:62"
},
{
kicker:"9. O túmulo vazio",
title:"Pedro diante da notícia",
body:`Na manhã da ressurreição, as mulheres foram ao sepulcro e levaram a notícia aos discípulos. Lucas relata que Pedro correu até o túmulo, inclinou-se e viu os lençóis postos ali; depois voltou, admirado com o que acontecera.

João também narra a ida de Pedro ao sepulcro acompanhado pelo outro discípulo. Os relatos diferem em detalhes, mas relacionam Pedro à descoberta de que o corpo de Jesus não estava mais no lugar onde havia sido colocado.

A ressurreição tornou-se o centro da proclamação apostólica. Pedro, que havia negado Jesus, seria posteriormente uma das vozes que anunciariam publicamente que Deus o ressuscitara.`,
verse:"Leitura: Lucas 24:1–12; João 20:1–10."
},
{
kicker:"10. A restauração",
title:"“Tu me amas?”",
body:`No Evangelho de João, Jesus ressuscitado encontra alguns discípulos junto ao mar da Galileia. Depois de uma pesca extraordinária e de uma refeição, Jesus pergunta a Pedro por três vezes se ele o ama.

A conversa está ligada à missão pastoral: Jesus lhe ordena que apascente seus cordeiros e ovelhas. A repetição das perguntas recorda, de forma significativa, as três negações, embora o texto não apresente a cena como uma simples equivalência mecânica.

Pedro recebe uma nova incumbência. Sua história mostra que o fracasso não deve ser minimizado, mas que Jesus também pode restaurar e chamar novamente ao serviço.`,
verse:"“Apascenta as minhas ovelhas.” — João 21:17"
},
{
kicker:"11. Pentecostes e a Igreja Primitiva",
title:"Pedro anuncia Cristo",
body:`Em Atos 2, depois da descida do Espírito Santo no dia de Pentecostes, Pedro se levanta com os onze e proclama a mensagem sobre Jesus. Ele anuncia sua morte e ressurreição e chama os ouvintes ao arrependimento.

Atos registra que muitas pessoas receberam a palavra e foram batizadas naquele dia. Pedro passa a aparecer como uma das principais vozes públicas da comunidade cristã de Jerusalém.

Sua atuação, porém, não substitui o papel dos demais apóstolos nem a ação do Espírito Santo. O relato apresenta a comunidade reunida em torno do ensino apostólico, da comunhão, do partir do pão e das orações.`,
verse:"Leitura: Atos 2:14–42."
},
{
kicker:"12. Coragem e testemunho",
title:"Diante das autoridades",
body:`Em Atos 3, Pedro e João encontram um homem coxo desde o nascimento junto à porta do templo. Após a cura, Pedro explica que o homem foi restaurado pelo nome de Jesus Cristo.

As autoridades religiosas interrogam os apóstolos e ordenam que não falem nem ensinem nesse nome. Pedro e João respondem que não podem deixar de falar do que viram e ouviram.

O livro de Atos destaca a coragem dos apóstolos e atribui a obra realizada ao poder de Jesus. A firmeza de Pedro contrasta com o medo que o levou a negar o Mestre durante a paixão.`,
verse:"Leitura: Atos 3:1–16; 4:1–20."
},
{
kicker:"13. Missão além de Jerusalém",
title:"Pedro e Cornélio",
body:`Atos 10 relata a visão de Pedro e o encontro com Cornélio, um gentio temente a Deus. Pedro compreende que não deveria considerar impuro aquilo que Deus havia purificado e anuncia a mensagem de Jesus na casa de Cornélio.

Enquanto Pedro falava, o Espírito Santo veio sobre os que ouviam a palavra. O acontecimento levou os cristãos presentes a reconhecer que Deus também concedia aos gentios o arrependimento para a vida.

Esse episódio é decisivo na narrativa de Atos porque evidencia a expansão da missão cristã para além das fronteiras judaicas. Pedro participa desse processo ao obedecer à orientação de Deus.`,
verse:"“Reconheço, por verdade, que Deus não faz acepção de pessoas.” — Atos 10:34"
},
{
kicker:"14. Serviço e liderança",
title:"Um apóstolo entre outros",
body:`Pedro exerceu papel importante na comunidade de Jerusalém e participou de decisões e debates sobre a inclusão dos gentios. Em Atos 15, ele recorda como Deus lhe confiou anunciar o evangelho aos gentios e como Deus lhes concedeu o Espírito Santo.

As Escrituras também mostram que a liderança apostólica era compartilhada. Tiago, Paulo, Barnabé e outros servos tiveram funções importantes na expansão e organização das comunidades cristãs.

A atuação de Pedro deve ser compreendida dentro desse testemunho coletivo. O Novo Testamento o apresenta como apóstolo destacado, mas não como o único responsável pela missão da Igreja Primitiva.`,
verse:"Leitura: Atos 15:6–11; Gálatas 2:7–9."
},
{
kicker:"15. As cartas atribuídas a Pedro",
title:"Fé, esperança e perseverança",
body:`O Novo Testamento contém duas cartas que trazem o nome de Pedro: 1 Pedro e 2 Pedro. Elas encorajam os leitores a permanecer firmes na fé, viver em santidade e suportar provações.

Primeira Pedro enfatiza a esperança viva por meio da ressurreição de Jesus, a conduta cristã e a perseverança diante do sofrimento. Segunda Pedro adverte contra falsos mestres e chama os leitores a crescer na graça e no conhecimento de Jesus Cristo.

A autoria e a datação dessas cartas são discutidas por estudiosos. Uma apresentação histórica responsável pode registrar a atribuição tradicional a Pedro e reconhecer que existem debates acadêmicos sobre a composição dos textos.`,
verse:"Leitura: 1 Pedro 1:3–9; 2 Pedro 3:17–18."
},
{
kicker:"16. Os últimos anos e a tradição",
title:"O que sabemos sobre sua morte?",
body:`O Novo Testamento não oferece uma narrativa detalhada da morte de Pedro. Jesus, no Evangelho de João, faz uma referência simbólica à morte pela qual Pedro glorificaria a Deus, mas não fornece data ou descrição completa do acontecimento.

A tradição cristã antiga associa Pedro ao ministério em Roma e ao martírio durante o governo de Nero, no século I. A tradição de que teria sido crucificado de cabeça para baixo é posterior e não é relatada diretamente no Novo Testamento.

É importante diferenciar o testemunho bíblico das tradições históricas posteriores. Não há consenso absoluto sobre todos os detalhes cronológicos e circunstanciais dos últimos anos de Pedro.`,
verse:"Referência bíblica: João 21:18–19. Tradições posteriores devem ser avaliadas como tais."
},
{
kicker:"17. Pedro na história do cristianismo",
title:"Memória e influência",
body:`Pedro ocupa lugar importante na memória de diferentes tradições cristãs. Católicos, ortodoxos e diversas comunidades protestantes reconhecem sua relevância apostólica, embora interpretem de formas distintas o alcance de sua autoridade e seu papel na história da Igreja.

A Igreja Católica relaciona Pedro de modo especial à origem histórica do episcopado de Roma e à doutrina do papado. Outras tradições cristãs valorizam seu testemunho apostólico sem aceitar as mesmas conclusões sobre a autoridade papal.

O estudo histórico deve apresentar essas diferenças com precisão, sem confundir as interpretações desenvolvidas ao longo dos séculos com afirmações explícitas de cada passagem bíblica.`,
verse:"Leitura: Mateus 16:13–20; Atos 15:1–21; 1 Pedro 5:1–4."
},
{
kicker:"18. Lições para a vida cristã",
title:"O que aprendemos com Pedro?",
body:`1. Responder ao chamado: Pedro deixou as redes para seguir Jesus.
2. Crescer no discipulado: conviveu com o Mestre e precisou ser corrigido.
3. Reconhecer a fragilidade: sua negação revelou os limites da autoconfiança.
4. Receber restauração: Jesus voltou a confiar-lhe uma missão.
5. Testemunhar com coragem: depois do Pentecostes, anunciou publicamente a ressurreição.
6. Servir com humildade: a liderança cristã é chamada a cuidar do rebanho, não a dominá-lo.

Essas lições surgem dos relatos bíblicos e apontam para a centralidade de Jesus na formação e na missão de Pedro.`,
verse:"Leitura: Lucas 22:31–32; João 21:15–19; 1 Pedro 5:2–3."
},
{
kicker:"19. Cronologia e referências",
title:"Percurso bíblico de Pedro",
body:`• Chamado junto ao mar da Galileia: Mateus 4:18–20.
• Nome e confissão de fé: João 1:40–42; Mateus 16:13–20.
• Transfiguração: Marcos 9:2–8.
• Negação de Jesus: Lucas 22:54–62.
• Visita ao túmulo: Lucas 24:1–12; João 20:1–10.
• Restauração junto ao mar: João 21:1–19.
• Pregação no Pentecostes: Atos 2:14–42.
• Testemunho diante das autoridades: Atos 3–4.
• Encontro com Cornélio: Atos 10.
• Participação no debate sobre os gentios: Atos 15:6–11.
• Cartas tradicionalmente atribuídas a Pedro: 1 Pedro e 2 Pedro.

Os textos bíblicos não fixam datas exatas para o nascimento ou a morte de Pedro. A tradição sobre seu martírio em Roma pertence à história posterior da Igreja.`,
verse:"Fonte principal: os Evangelhos, Atos dos Apóstolos e as cartas de Pedro."
},
{
kicker:"Encerramento",
title:"Um discípulo transformado em testemunha",
body:`A história de Pedro reúne chamado, fé, incompreensão, queda, restauração e serviço. Ele não é retratado como alguém sem falhas, mas como um discípulo cuja vida foi marcada pelo encontro com Jesus e pela missão de anunciar sua ressurreição.

Dos primeiros passos à pregação em Jerusalém e ao testemunho entre os gentios, Pedro aparece como uma figura importante na expansão da Igreja Primitiva. Sua trajetória também lembra que a liderança cristã exige coragem, humildade e cuidado com as pessoas.

Ao estudar sua vida, é importante manter Jesus Cristo no centro, distinguir as informações bíblicas das tradições posteriores e reconhecer a contribuição de Pedro no testemunho apostólico que deu forma à história do cristianismo.`,
verse:"“Apascenta as minhas ovelhas.” — João 21:17"
}
];

let current = 0;
const $ = id => document.getElementById(id);
const book = $("book");
function render(){
  const p = pages[current];
  $("kicker").textContent = p.kicker;
  $("pageTitle").textContent = p.title;
  $("pageBody").textContent = p.body;
  const quote = document.createElement("div");
  quote.className = "verse";
  quote.textContent = p.verse;
  $("pageBody").appendChild(quote);
  $("pageNumber").textContent = `${current+1} / ${pages.length}`;
  $("status").textContent = `Página ${current+1} de ${pages.length}`;
  $("progress").style.width = `${((current+1)/pages.length)*100}%`;
  $("pageText").textContent = `${p.title}\n\n${p.body}\n\n${p.verse}`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === pages.length-1;
}
function go(step){
  const next = current + step;
  if(next < 0 || next >= pages.length) return;
  current = next;
  book.classList.remove("turn-next","turn-prev");
  void book.offsetWidth;
  book.classList.add(step > 0 ? "turn-next" : "turn-prev");
  render();
}
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("read").addEventListener("click",()=>{
  if(!("speechSynthesis" in window)){alert("A leitura em voz alta não está disponível neste navegador.");return;}
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance($("pageText").textContent);
  utterance.lang = "pt-BR";
  utterance.rate = 0.94;
  speechSynthesis.speak(utterance);
});
$("stop").addEventListener("click",()=>{if("speechSynthesis" in window) speechSynthesis.cancel();});
let startX = 0;
book.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX;},{passive:true});
book.addEventListener("touchend",e=>{
  const diff=e.changedTouches[0].screenX-startX;
  if(Math.abs(diff)>55) go(diff<0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
render();
</script>
</body>
</html>
