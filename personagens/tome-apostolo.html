<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tomé, apóstolo: vida, chamado, testemunho e importância na história do cristianismo, à luz do Novo Testamento.">
<title>Flipbook — História do Cristianismo: Tomé, apóstolo</title>
<style>
:root{--ink:#29251f;--gold:#b58a42;--paper:#fffdf7;--bg:#e9e3d8;--muted:#6b5b46}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f1e8,#ddd4c5);font-family:Georgia,"Times New Roman",serif;color:var(--ink);min-height:100vh}
header{text-align:center;padding:24px 14px 12px}
h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 7px;color:#352a1d}
.subtitle{font-size:.98rem;color:var(--muted);margin:0 auto;max-width:780px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:12px 14px 32px}
.stage{display:flex;justify-content:center;align-items:center;min-height:54vh;padding:8px 0 18px;perspective:1600px}
.book{position:relative;width:min(94vw,760px);min-height:460px;background:var(--paper);border-radius:4px 12px 12px 4px;box-shadow:0 18px 45px #46331f35,0 2px 6px #46331f20;overflow:hidden;transform-origin:left center;padding:clamp(24px,5vw,54px)}
.book:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,#d4c4a9,#fff8e9)}
.book.turn-next{animation:turnNext .32s ease}.book.turn-prev{animation:turnPrev .32s ease}
@keyframes turnNext{0%{transform:rotateY(0)}45%{transform:rotateY(-5deg) translateX(-3px)}100%{transform:rotateY(0)}}
@keyframes turnPrev{0%{transform:rotateY(0)}45%{transform:rotateY(5deg) translateX(3px)}100%{transform:rotateY(0)}}
.page-kicker{font:700 .76rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#967039;margin:0 0 12px}
.page-title{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.18;color:#352a1d;margin:0 0 18px}
.page-body{font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.8;white-space:pre-line}
.page-body p{margin:0 0 14px}
.verse{margin:22px 0;padding:15px 18px;border-left:3px solid var(--gold);background:#f5efe3;color:#51412c;font-style:italic;line-height:1.65}
.verse strong{display:block;font:700 .82rem system-ui,sans-serif;font-style:normal;margin-top:8px;color:#80602c}
.page-number{position:absolute;bottom:15px;right:24px;color:#9b8b73;font:.8rem system-ui,sans-serif}
.progress{height:5px;background:#d5c9b7;border-radius:9px;overflow:hidden;max-width:760px;margin:0 auto 15px}
.progress span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.status{text-align:center;font:500 .95rem system-ui,sans-serif;color:#5b5144;margin:8px 0}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:8px 0 14px}
button{border:1px solid #b8a17d;background:#fffdf7;color:#352a1d;border-radius:999px;padding:10px 15px;font-size:.95rem;cursor:pointer;box-shadow:0 2px 5px #46331f12}
button.primary{background:#6f4e27;color:white;border-color:#6f4e27}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid #d3a64d;outline-offset:2px}
.reader{max-width:760px;margin:18px auto 0;padding:15px 17px;background:#fffdf7c9;border:1px solid #d6c6ad;border-radius:12px;font-family:system-ui,sans-serif}
.reader h2{font-size:1.05rem;margin:0 0 8px}.reader p{font-size:.94rem;line-height:1.6;margin:0;white-space:pre-line}
.hint{text-align:center;font:.82rem system-ui,sans-serif;color:#756954;margin-top:10px}
@media(max-width:560px){.book{min-height:540px;padding:28px 23px 45px}.page-body{line-height:1.68}.controls button{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.book,.progress span{transition:none}.book.turn-next,.book.turn-prev{animation:none}}
</style>
</head>
<body>
<header>
<h1>História do Cristianismo</h1>
<p class="subtitle">Tomé, apóstolo · Da dúvida ao testemunho da ressurreição</p>
</header>
<main>
<div class="stage"><article class="book" id="book" aria-live="polite">
<p class="page-kicker" id="kicker"></p><h2 class="page-title" id="pageTitle"></h2><div class="page-body" id="pageBody"></div><div class="page-number" id="pageNumber"></div>
</article></div>
<div class="progress" aria-label="Progresso de leitura"><span id="progress"></span></div>
<div class="status" id="status" aria-live="polite">Página 1</div>
<div class="controls">
<button id="prev" aria-label="Página anterior">← Anterior</button>
<button id="next" class="primary" aria-label="Próxima página">Próxima →</button>
<button id="read">🔊 Ler esta página</button>
<button id="stop">⏹ Parar voz</button>
</div>
<section class="reader"><h2>Leitor de voz e texto da página</h2><p id="pageText"></p></section>
<p class="hint">Deslize para a esquerda ou direita no celular para virar as páginas. A leitura em voz alta usa a voz disponível no navegador ou aparelho.</p>
</main>
<script>
const pages = [
{
kicker:"História do Cristianismo",
title:"Tomé, apóstolo",
body:"Tomé foi um dos doze apóstolos escolhidos por Jesus. É conhecido especialmente pelo episódio em que, após a ressurreição, declarou que precisava ver as marcas dos cravos e tocar no lado de Jesus para crer. Quando Jesus apareceu novamente, Tomé respondeu com uma das mais fortes confissões de fé do Novo Testamento: “Senhor meu, e Deus meu!”.\n\nO Evangelho de João preserva outros momentos importantes em que Tomé fala e demonstra disposição de acompanhar Jesus, mesmo sem compreender plenamente o que estava para acontecer.\n\nSua história não deve ser reduzida a um rótulo. Os textos bíblicos apresentam um discípulo real, com perguntas, coragem, limites e uma confissão decisiva sobre a identidade de Cristo.",
verse:"“Senhor meu, e Deus meu!” — João 20:28"
},
{
kicker:"1. Identificação e contexto",
title:"Quem foi Tomé?",
body:"Tomé aparece nas listas dos doze apóstolos. O Evangelho de João informa que também era chamado Dídimo, palavra que significa “gêmeo”. O texto bíblico, porém, não identifica seu irmão ou irmã nem fornece detalhes sobre sua família.\n\nOs Evangelhos Sinóticos o mencionam nas listas apostólicas, mas não narram episódios individuais envolvendo-o. O Evangelho de João registra algumas de suas falas e ações, permitindo conhecer aspectos de sua relação com Jesus.\n\nA Bíblia não informa a data de nascimento de Tomé, sua profissão antes do discipulado ou muitos detalhes de sua vida fora dos episódios registrados.",
verse:"Leitura: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16; João 11:16; 20:24."
},
{
kicker:"2. Seu nome",
title:"Tomé, chamado Dídimo",
body:"João apresenta o apóstolo como “Tomé, chamado Dídimo”. Os dois nomes estão relacionados à ideia de gêmeo: “Tomé” vem de uma palavra aramaica, enquanto “Dídimo” é a forma grega.\n\nEssa informação é explícita no texto bíblico. Entretanto, não há no Novo Testamento uma explicação sobre quem seria seu irmão gêmeo ou sobre as circunstâncias de seu nascimento.\n\nAo estudar personagens bíblicos, é importante distinguir o significado de um nome dos detalhes biográficos que a Escritura não revela.",
verse:"“Tomé, chamado Dídimo” — João 20:24"
},
{
kicker:"3. Uma declaração de coragem",
title:"Vamos também para morrer com ele",
body:"Quando Jesus decidiu voltar à Judeia, os discípulos lembraram que havia perigo naquela região, pois algumas pessoas tinham procurado apedrejá-lo. Nesse contexto, Tomé disse aos demais: “Vamos nós também, para morrermos com ele”.\n\nA fala surge após Jesus anunciar que Lázaro havia morrido e que iria até ele. O relato demonstra que Tomé compreendia a gravidade do risco e, ainda assim, expressou disposição de acompanhar o Mestre.\n\nO texto não esclarece se Tomé falou com plena compreensão de tudo o que Jesus faria. Mas sua declaração revela compromisso com o grupo e disposição de permanecer ao lado de Jesus diante do perigo.",
verse:"Leitura: João 11:7–16."
},
{
kicker:"4. A pergunta no caminho",
title:"Tomé quer compreender",
body:"Na última ceia, Jesus falou aos discípulos sobre sua partida e afirmou que eles conheciam o caminho para onde ele iria. Tomé respondeu que não sabia para onde Jesus estava indo e perguntou como poderiam conhecer o caminho.\n\nA pergunta deu ocasião a uma das declarações centrais de Jesus: “Eu sou o caminho, e a verdade, e a vida”. Jesus ensinou que o acesso ao Pai está ligado a ele.\n\nTomé aparece aqui como alguém que não esconde sua falta de compreensão. Sua pergunta permite que o ensino de Jesus fique registrado de forma clara para os leitores do Evangelho.",
verse:"“Eu sou o caminho, e a verdade, e a vida.” — João 14:6"
},
{
kicker:"5. A morte e a ressurreição",
title:"O contexto da última ceia",
body:"A conversa em que Tomé pergunta sobre o caminho acontece na última ceia, pouco antes da prisão de Jesus. O Mestre prepara os discípulos para sua partida e lhes ensina sobre a relação entre ele e o Pai.\n\nO Evangelho de João não descreve detalhadamente as ações individuais de Tomé durante a prisão, o julgamento e a crucificação. Portanto, não devemos acrescentar cenas ou falas que o texto não registra.\n\nO que se pode afirmar é que Tomé fazia parte do círculo dos apóstolos e que o Evangelho volta a mencioná-lo de maneira destacada após a ressurreição.",
verse:"Leitura: João 13–14; 18–19."
},
{
kicker:"6. A ausência na primeira aparição",
title:"Tomé não estava com os discípulos",
body:"Na tarde do primeiro dia da semana, Jesus apareceu aos discípulos reunidos. O Evangelho de João observa que Tomé, chamado Dídimo, um dos doze, não estava com eles naquela ocasião.\n\nQuando os outros discípulos lhe disseram que tinham visto o Senhor, Tomé respondeu que precisava ver a marca dos cravos, colocar o dedo nela e tocar no lado de Jesus para crer.\n\nO relato não informa por que Tomé estava ausente. Também não autoriza concluir que ele jamais acreditaria; registra a reação que teve diante do testemunho dos companheiros.",
verse:"Leitura: João 20:19–25."
},
{
kicker:"7. A declaração que marcou sua memória",
title:"“Se eu não vir...”",
body:"Tomé expressou uma exigência concreta: queria ver as marcas dos cravos e tocar no lado de Jesus. Sua resposta ficou conhecida na tradição cristã como o episódio da dúvida de Tomé.\n\nÉ importante ler a cena em seu contexto. Os discípulos já haviam recebido o testemunho das mulheres e, naquela noite, Jesus se apresentou a eles. Tomé, porém, não estava presente e reagiu ao anúncio dos companheiros.\n\nO Evangelho registra a fala de Tomé sem esconder sua dificuldade. A narrativa prossegue mostrando que Jesus se dirige a ele e lhe oferece a oportunidade de reconhecer a realidade da ressurreição.",
verse:"Leitura: João 20:24–25."
},
{
kicker:"8. Jesus aparece novamente",
title:"Oito dias depois",
body:"Oito dias depois, os discípulos estavam reunidos novamente, e Tomé estava com eles. As portas estavam fechadas, mas Jesus veio, pôs-se no meio deles e saudou-os com a paz.\n\nEm seguida, Jesus falou diretamente a Tomé, mencionando as marcas dos cravos e o lado ferido. Convidou-o a verificar e o chamou a não ser incrédulo, mas crente.\n\nO texto não descreve Tomé tocando fisicamente nas feridas. O que relata é o convite de Jesus e a resposta imediata do apóstolo, que faz uma confissão de fé.",
verse:"Leitura: João 20:26–27."
},
{
kicker:"9. “Senhor meu, e Deus meu!”",
title:"A confissão de Tomé",
body:"Diante de Jesus, Tomé respondeu: “Senhor meu, e Deus meu!”. Essa declaração é o ponto culminante de sua participação no Evangelho de João. Ele reconhece Jesus com uma confissão direta e profunda.\n\nA narrativa não diz que Tomé precisou tocar nas feridas para crer. Depois do convite de Jesus, o apóstolo pronuncia sua confissão. Por isso, é melhor não acrescentar ao texto um gesto que João não descreve.\n\nA resposta de Tomé também prepara o ensino seguinte de Jesus sobre aqueles que não viram e creram. O episódio conduz o leitor ao propósito do Evangelho: crer que Jesus é o Cristo, o Filho de Deus.",
verse:"“Senhor meu, e Deus meu!” — João 20:28"
},
{
kicker:"10. A bem-aventurança dos que creem",
title:"Crer sem ter visto",
body:"Jesus disse a Tomé que ele creu porque o viu e declarou bem-aventurados os que não viram e creram. A afirmação não elimina a importância do testemunho apostólico; mostra como as gerações seguintes seriam chamadas a crer por meio do testemunho preservado.\n\nO Evangelho explica que muitos outros sinais de Jesus não foram escritos naquele livro, mas aqueles registrados foram escolhidos para que os leitores creiam que Jesus é o Cristo, o Filho de Deus, e tenham vida em seu nome.\n\nAssim, a experiência de Tomé torna-se parte do testemunho destinado também aos que não estiveram presentes naquela sala.",
verse:"Leitura: João 20:29–31."
},
{
kicker:"11. Tomé entre os apóstolos",
title:"Presença na comunidade",
body:"Atos dos Apóstolos menciona Tomé entre os apóstolos que estavam reunidos em Jerusalém depois da ascensão de Jesus. Ele aparece na lista junto de Pedro, João, Tiago, André, Filipe, Bartolomeu, Mateus, Tiago filho de Alfeu, Simão e Judas filho de Tiago.\n\nA referência confirma sua participação na comunidade apostólica no período inicial da Igreja. O grupo perseverava em oração, aguardando o cumprimento da promessa do Espírito Santo.\n\nAtos não apresenta nesse trecho uma biografia posterior de Tomé nem descreve suas viagens missionárias.",
verse:"Leitura: Atos 1:12–14."
},
{
kicker:"12. Tradições sobre sua missão",
title:"A memória cristã de Tomé",
body:"Tradições cristãs antigas associaram Tomé à evangelização de regiões orientais, especialmente à Índia. Comunidades cristãs indianas mantêm uma antiga memória de sua ligação com a pregação do evangelho naquela região.\n\nTambém existem relatos posteriores sobre viagens e sobre sua morte. Esses relatos pertencem à tradição e à memória eclesiástica; não são narrados com detalhes no Novo Testamento.\n\nPor isso, uma apresentação histórica responsável deve distinguir as referências bíblicas seguras das tradições desenvolvidas ao longo dos séculos. A Bíblia confirma Tomé como apóstolo, mas não fornece um itinerário completo de sua missão.",
verse:"Referências bíblicas: João 11:16; 14:5; 20:24–29; 21:2; Atos 1:13."
},
{
kicker:"13. Tomé na história do cristianismo",
title:"Um apóstolo lembrado no Oriente",
body:"Tomé ocupa lugar importante na memória de diversas comunidades cristãs. A tradição ligada aos cristãos de São Tomé, na Índia, preserva a convicção de que o apóstolo levou o evangelho àquela região.\n\nAo longo da história, sua figura também inspirou pregações, pinturas, textos devocionais e reflexões sobre fé e testemunho. O episódio de João 20 tornou-se especialmente conhecido, mas não deve apagar as outras cenas em que Tomé demonstra compromisso e busca compreender o ensino de Jesus.\n\nA história de sua recepção mostra como a memória dos apóstolos atravessou culturas e continentes.",
verse:"Leitura complementar: João 20:24–31."
},
{
kicker:"14. Lições para a vida cristã",
title:"O que aprendemos com Tomé?",
body:"1. A fé pode caminhar junto com perguntas sinceras: Tomé expressou o que não compreendia.\n2. Permanecer com Cristo exige compromisso: ele declarou disposição de acompanhar Jesus mesmo diante do perigo.\n3. A Palavra de Jesus ilumina nossas dúvidas: sua pergunta deu ocasião ao ensino de João 14:6.\n4. O testemunho deve ser recebido com seriedade: os discípulos anunciaram que tinham visto o Senhor.\n5. A fé conduz à confissão: Tomé reconheceu Jesus como Senhor e Deus.\n\nEssas lições não transformam a dúvida em virtude nem condenam toda pergunta. Elas mostram que o encontro com Cristo é o centro da narrativa e que a confissão de fé é a resposta decisiva do apóstolo.",
verse:"“Bem-aventurados os que não viram e creram.” — João 20:29"
},
{
kicker:"15. Cronologia e referências",
title:"Percurso bíblico de Tomé",
body:"• Incluído entre os doze apóstolos: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16.\n• Declara disposição de acompanhar Jesus à Judeia: João 11:7–16.\n• Pergunta sobre o caminho para onde Jesus vai: João 14:1–6.\n• Não está presente na primeira aparição de Jesus aos discípulos: João 20:19–25.\n• Encontra Jesus na reunião seguinte e faz sua confissão: João 20:26–29.\n• Mencionado entre os apóstolos reunidos em Jerusalém: Atos 1:13.\n• Aparece novamente entre os discípulos junto ao mar da Galileia: João 21:1–2.\n\nAs Escrituras não informam datas exatas de nascimento e morte de Tomé nem apresentam uma biografia completa de suas atividades posteriores.",
verse:"Fonte principal: Novo Testamento."
},
{
kicker:"Encerramento",
title:"Da pergunta à confissão de fé",
body:"Tomé, apóstolo, ocupa um lugar singular na história do cristianismo. O Evangelho de João não esconde suas perguntas nem sua dificuldade diante do anúncio da ressurreição. Também registra sua disposição de acompanhar Jesus e, acima de tudo, sua confissão: “Senhor meu, e Deus meu!”.\n\nSua história ensina que as perguntas humanas devem ser levadas à presença de Cristo e que o testemunho apostólico aponta para a realidade da ressurreição. A narrativa termina conduzindo o leitor à fé em Jesus, o Cristo, o Filho de Deus.\n\nMais do que ser lembrado apenas por uma dúvida, Tomé deve ser conhecido pelo testemunho bíblico completo e pela confissão que pronunciou diante do Senhor ressuscitado.",
verse:"“Para que creiais que Jesus é o Cristo, o Filho de Deus.” — João 20:31"
}
];

let current = 0;
const $ = id => document.getElementById(id);
const book = $("book");
function render(){
  const p = pages[current];
  $("kicker").textContent = p.kicker;
  $("pageTitle").textContent = p.title;
  $("pageBody").textContent = p.body;
  const quote = document.createElement("div");
  quote.className = "verse";
  quote.textContent = p.verse;
  $("pageBody").appendChild(quote);
  $("pageNumber").textContent = `${current+1} / ${pages.length}`;
  $("status").textContent = `Página ${current+1} de ${pages.length}`;
  $("progress").style.width = `${((current+1)/pages.length)*100}%`;
  $("pageText").textContent = `${p.title}\n\n${p.body}\n\n${p.verse}`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === pages.length-1;
}
function go(step){
  const next = current + step;
  if(next < 0 || next >= pages.length) return;
  current = next;
  book.classList.remove("turn-next","turn-prev");
  void book.offsetWidth;
  book.classList.add(step > 0 ? "turn-next" : "turn-prev");
  render();
}
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("read").addEventListener("click",()=>{
  if(!("speechSynthesis" in window)){alert("A leitura em voz alta não está disponível neste navegador.");return;}
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance($("pageText").textContent);
  utterance.lang = "pt-BR";
  utterance.rate = 0.94;
  speechSynthesis.speak(utterance);
});
$("stop").addEventListener("click",()=>{if("speechSynthesis" in window) speechSynthesis.cancel();});
let startX = 0;
book.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX;},{passive:true});
book.addEventListener("touchend",e=>{
  const diff=e.changedTouches[0].screenX-startX;
  if(Math.abs(diff)>55) go(diff<0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
render();
</script>
</body>
</html>
