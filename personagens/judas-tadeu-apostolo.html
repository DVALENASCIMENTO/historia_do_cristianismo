<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Judas Tadeu, apóstolo: referências bíblicas, sua pergunta a Jesus e as tradições cristãs posteriores.">
<title>Flipbook — História do Cristianismo: Judas Tadeu</title>
<style>
:root{--ink:#29251f;--gold:#b58a42;--paper:#fffdf7;--bg:#e9e3d8;--muted:#6b5b46}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f1e8,#ddd4c5);font-family:Georgia,"Times New Roman",serif;color:var(--ink);min-height:100vh}
header{text-align:center;padding:24px 14px 12px}
h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 7px;color:#352a1d}
.subtitle{font-size:.98rem;color:var(--muted);margin:0 auto;max-width:780px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:12px 14px 32px}
.stage{display:flex;justify-content:center;align-items:center;min-height:54vh;padding:8px 0 18px;perspective:1600px}
.book{position:relative;width:min(94vw,760px);min-height:460px;background:var(--paper);border-radius:4px 12px 12px 4px;box-shadow:0 18px 45px #46331f35,0 2px 6px #46331f20;overflow:hidden;transform-origin:left center;padding:clamp(24px,5vw,54px)}
.book:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,#d4c4a9,#fff8e9)}
.book.turn-next{animation:turnNext .32s ease}.book.turn-prev{animation:turnPrev .32s ease}
@keyframes turnNext{0%{transform:rotateY(0)}45%{transform:rotateY(-5deg) translateX(-3px)}100%{transform:rotateY(0)}}
@keyframes turnPrev{0%{transform:rotateY(0)}45%{transform:rotateY(5deg) translateX(3px)}100%{transform:rotateY(0)}}
.page-kicker{font:700 .76rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#967039;margin:0 0 12px}
.page-title{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.18;color:#352a1d;margin:0 0 18px}
.page-body{font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.8;white-space:pre-line}
.page-body p{margin:0 0 14px}
.verse{margin:22px 0;padding:15px 18px;border-left:3px solid var(--gold);background:#f5efe3;color:#51412c;font-style:italic;line-height:1.65}
.verse strong{display:block;font:700 .82rem system-ui,sans-serif;font-style:normal;margin-top:8px;color:#80602c}
.page-number{position:absolute;bottom:15px;right:24px;color:#9b8b73;font:.8rem system-ui,sans-serif}
.progress{height:5px;background:#d5c9b7;border-radius:9px;overflow:hidden;max-width:760px;margin:0 auto 15px}
.progress span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.status{text-align:center;font:500 .95rem system-ui,sans-serif;color:#5b5144;margin:8px 0}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:8px 0 14px}
button{border:1px solid #b8a17d;background:#fffdf7;color:#352a1d;border-radius:999px;padding:10px 15px;font-size:.95rem;cursor:pointer;box-shadow:0 2px 5px #46331f12}
button.primary{background:#6f4e27;color:white;border-color:#6f4e27}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid #d3a64d;outline-offset:2px}
.reader{max-width:760px;margin:18px auto 0;padding:15px 17px;background:#fffdf7c9;border:1px solid #d6c6ad;border-radius:12px;font-family:system-ui,sans-serif}
.reader h2{font-size:1.05rem;margin:0 0 8px}.reader p{font-size:.94rem;line-height:1.6;margin:0;white-space:pre-line}
.hint{text-align:center;font:.82rem system-ui,sans-serif;color:#756954;margin-top:10px}
@media(max-width:560px){.book{min-height:540px;padding:28px 23px 45px}.page-body{line-height:1.68}.controls button{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.book,.progress span{transition:none}.book.turn-next,.book.turn-prev{animation:none}}
</style>
</head>
<body>
<header>
<h1>História do Cristianismo</h1>
<p class="subtitle">Judas Tadeu · Um dos doze apóstolos</p>
</header>
<main>
<div class="stage"><article class="book" id="book" aria-live="polite">
<p class="page-kicker" id="kicker"></p><h2 class="page-title" id="pageTitle"></h2><div class="page-body" id="pageBody"></div><div class="page-number" id="pageNumber"></div>
</article></div>
<div class="progress" aria-label="Progresso de leitura"><span id="progress"></span></div>
<div class="status" id="status" aria-live="polite">Página 1</div>
<div class="controls">
<button id="prev" aria-label="Página anterior">← Anterior</button>
<button id="next" class="primary" aria-label="Próxima página">Próxima →</button>
<button id="read">🔊 Ler esta página</button>
<button id="stop">⏹ Parar voz</button>
</div>
<section class="reader"><h2>Leitor de voz e texto da página</h2><p id="pageText"></p></section>
<p class="hint">Deslize para a esquerda ou direita no celular para virar as páginas. A leitura em voz alta usa a voz disponível no navegador ou aparelho.</p>
</main>
<script>
const pages = [
  {
    "kicker": "Apresentação",
    "title": "Judas Tadeu, apóstolo",
    "body": "Judas Tadeu é lembrado entre os doze apóstolos de Jesus. Seu nome aparece nas listas apostólicas sob formas diferentes: Mateus e Marcos mencionam Tadeu, enquanto Lucas e Atos apresentam Judas, filho de Tiago. A tradição cristã passou a chamá-lo Judas Tadeu para distingui-lo de Judas Iscariotes.\n\nEste material apresenta as referências bíblicas, seu lugar entre os apóstolos e as tradições posteriores, separando o que está escrito nas Escrituras daquilo que pertence à memória histórica da Igreja.",
    "verse": "Leitura: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16; Atos 1:13."
  },
  {
    "kicker": "1. Identificação",
    "title": "Quem foi Judas Tadeu?",
    "body": "Judas Tadeu é um dos nomes associados a um dos doze apóstolos. Em Mateus 10:3 e Marcos 3:18 aparece Tadeu. Em Lucas 6:16 e Atos 1:13, encontramos Judas, filho de Tiago. A diferença de nomes é reconhecida nas tradições e traduções cristãs, embora os textos não expliquem detalhadamente essa variação.",
    "verse": "Leitura: Mateus 10:3; Marcos 3:18; Lucas 6:16; Atos 1:13."
  },
  {
    "kicker": "2. Os nomes",
    "title": "Tadeu e Judas, filho de Tiago",
    "body": "As listas dos apóstolos não apresentam exatamente a mesma forma para todos os nomes. Mateus e Marcos registram Tadeu; Lucas e Atos registram Judas, filho de Tiago. Por isso, muitas tradições identificam esse discípulo como Judas Tadeu.\n\nÉ importante não confundi-lo com Judas Iscariotes, o discípulo que traiu Jesus. Os próprios relatos distinguem os dois.",
    "verse": "Leitura: João 14:22; Lucas 6:16; Atos 1:13."
  },
  {
    "kicker": "3. Entre os doze",
    "title": "Escolhido para estar com Jesus",
    "body": "Judas Tadeu é contado entre os doze escolhidos por Jesus. Marcos informa que Jesus chamou aqueles que ele quis para que estivessem com ele e para enviá-los a pregar. A presença de Judas nas listas demonstra que ele fazia parte desse grupo central de discípulos.\n\nOs Evangelhos não relatam em detalhes a ocasião individual de seu chamado.",
    "verse": "Leitura: Marcos 3:13–19; Lucas 6:12–16."
  },
  {
    "kicker": "4. A missão",
    "title": "Participante do envio apostólico",
    "body": "Jesus enviou os doze para anunciar o Reino de Deus e exercer a missão que lhes confiara. Mateus 10 e Marcos 6 apresentam instruções dadas ao grupo. Judas Tadeu, por integrar a lista dos doze, estava entre os apóstolos enviados.\n\nOs textos não preservam um diário de suas viagens nem descrevem individualmente suas pregações.",
    "verse": "Leitura: Mateus 10:1–15; Marcos 6:7–13."
  },
  {
    "kicker": "5. A pergunta a Jesus",
    "title": "“Senhor, de onde vem que...”",
    "body": "João 14:22 registra uma pergunta feita por Judas — identificado como “não o Iscariotes”. Ele pergunta por que Jesus se manifestaria aos discípulos e não ao mundo. A pergunta surge durante as palavras de despedida de Jesus.\n\nEsse breve diálogo é a fala mais conhecida atribuída a Judas Tadeu nos Evangelhos. Ela mostra um discípulo buscando compreender o ensino do Mestre.",
    "verse": "Leitura: João 14:21–24."
  },
  {
    "kicker": "6. A resposta de Jesus",
    "title": "Amor, obediência e comunhão",
    "body": "Em resposta à pergunta, Jesus ensina que aquele que o ama guarda sua palavra. Ele fala do amor do Pai, da presença divina junto daquele que ama e da vinda do Consolador, o Espírito Santo.\n\nO foco do trecho não é uma curiosidade sobre o futuro, mas a relação entre amor, obediência e comunhão com Deus. A pergunta de Judas introduz uma das declarações importantes do discurso de despedida.",
    "verse": "Leitura: João 14:21–26."
  },
  {
    "kicker": "7. Não era Iscariotes",
    "title": "Uma distinção necessária",
    "body": "O evangelista João faz questão de identificar o interlocutor como Judas, “não o Iscariotes”. Isso evita confundir o apóstolo que faz a pergunta com Judas Iscariotes, conhecido por sua traição.\n\nA distinção é essencial para a leitura cuidadosa dos textos. Judas Tadeu pertence ao grupo dos discípulos fiéis que aparecem reunidos após a ascensão de Jesus.",
    "verse": "Leitura: João 14:22; Atos 1:13."
  },
  {
    "kicker": "8. Depois da ascensão",
    "title": "Perseverança em oração",
    "body": "Atos 1:12–14 descreve os discípulos reunidos em Jerusalém depois da ascensão de Jesus. Na lista dos apóstolos, aparece Judas, filho de Tiago. O grupo perseverava unanimemente em oração, juntamente com mulheres, Maria, mãe de Jesus, e os irmãos de Jesus.\n\nEssa referência situa Judas na comunidade apostólica que aguardava a promessa do Pai.",
    "verse": "Leitura: Atos 1:12–14."
  },
  {
    "kicker": "9. A Igreja nascente",
    "title": "Parte do testemunho apostólico",
    "body": "A comunidade reunida em Jerusalém aguardava o cumprimento da promessa do Espírito Santo. Os apóstolos aparecem como testemunhas da ressurreição e participantes dos primeiros momentos da Igreja. Judas, filho de Tiago, é mencionado nessa relação.\n\nO texto bíblico não descreve o restante de sua trajetória com a mesma riqueza de detalhes que apresenta sobre Pedro, João ou Paulo.",
    "verse": "Leitura: Atos 1:1–14."
  },
  {
    "kicker": "10. A carta de Judas",
    "title": "Uma associação que exige cuidado",
    "body": "O Novo Testamento contém a Epístola de Judas, cujo autor se apresenta como servo de Jesus Cristo e irmão de Tiago (Judas 1). A carta não se identifica diretamente como escrita por Judas Tadeu, um dos doze.\n\nAo longo da história cristã houve associações entre o autor da carta e Judas, irmão de Tiago, ou Judas Tadeu. A identificação exata é discutida; por isso, não se deve afirmar sem ressalvas que o apóstolo escreveu a epístola.",
    "verse": "Leitura: Judas 1:1; Lucas 6:16."
  },
  {
    "kicker": "11. Tradições missionárias",
    "title": "O que a Bíblia não detalha",
    "body": "A Bíblia não apresenta um relato biográfico completo sobre as viagens missionárias, a pregação em regiões específicas ou a morte de Judas Tadeu. Informações desse tipo aparecem em tradições cristãs posteriores, que variam entre comunidades e fontes.\n\nEssas tradições são importantes para estudar a memória do apóstolo, mas devem ser identificadas como tradições, não como declarações explícitas do Novo Testamento.",
    "verse": "Referências bíblicas principais: Mateus 10:3; Marcos 3:18; Lucas 6:16; Atos 1:13."
  },
  {
    "kicker": "12. Devoção cristã",
    "title": "A memória de Judas Tadeu",
    "body": "Em diversas comunidades cristãs, Judas Tadeu é venerado como apóstolo e lembrado em orações e celebrações. Sua memória devocional se desenvolveu ao longo dos séculos.\n\nA devoção histórica não substitui a leitura das fontes. Para conhecer o personagem com rigor, é necessário distinguir os poucos dados bíblicos das narrativas e práticas religiosas que se desenvolveram posteriormente.",
    "verse": "Leitura: João 14:22; Atos 1:13."
  },
  {
    "kicker": "13. Lições espirituais",
    "title": "A importância de perguntar e aprender",
    "body": "A pergunta de Judas em João 14 mostra que os discípulos nem sempre compreendiam imediatamente as palavras de Jesus. Ainda assim, podiam perguntar, ouvir e continuar aprendendo.\n\nA passagem também destaca que o amor a Cristo se expressa em guardar sua palavra. A vida cristã envolve relacionamento, escuta, obediência e dependência do Espírito Santo.",
    "verse": "Leitura: João 14:21–26."
  },
  {
    "kicker": "14. Síntese bíblica",
    "title": "O que podemos afirmar",
    "body": "Podemos afirmar que Judas Tadeu — identificado nas listas de diferentes formas — pertence ao grupo dos doze apóstolos; que João registra uma pergunta feita por Judas não Iscariotes; e que Atos menciona Judas, filho de Tiago, entre os discípulos reunidos em Jerusalém.\n\nNão temos, nos textos bíblicos, uma biografia extensa, um itinerário missionário detalhado ou uma descrição segura de sua morte.",
    "verse": "Leitura: Mateus 10:2–4; Marcos 3:16–19; João 14:22; Atos 1:13."
  },
  {
    "kicker": "15. Linha do tempo",
    "title": "As referências no Novo Testamento",
    "body": "• Escolhido e contado entre os doze: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16.\n\n• Faz uma pergunta a Jesus durante o discurso de despedida: João 14:22.\n\n• Aparece entre os discípulos reunidos em Jerusalém após a ascensão: Atos 1:13–14.\n\nEssa sequência reúne as referências bíblicas, não uma cronologia completa de sua vida.",
    "verse": "Leitura: textos indicados nesta página."
  },
  {
    "kicker": "Encerramento",
    "title": "Um apóstolo lembrado pela pergunta",
    "body": "Judas Tadeu ocupa um lugar nas listas dos doze e aparece no Evangelho de João como discípulo que pergunta a Jesus sobre sua manifestação. Mesmo com poucas informações biográficas, sua presença faz parte do testemunho apostólico preservado no Novo Testamento.\n\nSeu registro nos convida a buscar entendimento, permanecer junto de Cristo e guardar sua palavra.",
    "verse": "“Se alguém me ama, guardará a minha palavra.” — João 14:23"
  }
];

let current = 0;
const $ = id => document.getElementById(id);
const book = $("book");
function render(){
  const p = pages[current];
  $("kicker").textContent = p.kicker;
  $("pageTitle").textContent = p.title;
  $("pageBody").textContent = p.body;
  const quote = document.createElement("div");
  quote.className = "verse";
  quote.textContent = p.verse;
  $("pageBody").appendChild(quote);
  $("pageNumber").textContent = `${current+1} / ${pages.length}`;
  $("status").textContent = `Página ${current+1} de ${pages.length}`;
  $("progress").style.width = `${((current+1)/pages.length)*100}%`;
  $("pageText").textContent = `${p.title}\n\n${p.body}\n\n${p.verse}`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === pages.length-1;
}
function go(step){
  const next = current + step;
  if(next < 0 || next >= pages.length) return;
  current = next;
  book.classList.remove("turn-next","turn-prev");
  void book.offsetWidth;
  book.classList.add(step > 0 ? "turn-next" : "turn-prev");
  render();
}
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("read").addEventListener("click",()=>{
  if(!("speechSynthesis" in window)){alert("A leitura em voz alta não está disponível neste navegador.");return;}
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance($("pageText").textContent);
  utterance.lang = "pt-BR";
  utterance.rate = 0.94;
  speechSynthesis.speak(utterance);
});
$("stop").addEventListener("click",()=>{if("speechSynthesis" in window) speechSynthesis.cancel();});
let startX = 0;
book.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX;},{passive:true});
book.addEventListener("touchend",e=>{
  const diff=e.changedTouches[0].screenX-startX;
  if(Math.abs(diff)>55) go(diff<0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
render();
</script>
</body>
</html>
