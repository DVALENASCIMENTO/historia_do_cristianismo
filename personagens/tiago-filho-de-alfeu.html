<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tiago, filho de Alfeu: presença entre os doze apóstolos e o que o Novo Testamento permite conhecer sobre sua vida.">
<title>Flipbook — História do Cristianismo: Tiago, filho de Alfeu</title>
<style>
:root{--ink:#29251f;--gold:#b58a42;--paper:#fffdf7;--bg:#e9e3d8;--muted:#6b5b46}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f1e8,#ddd4c5);font-family:Georgia,"Times New Roman",serif;color:var(--ink);min-height:100vh}
header{text-align:center;padding:24px 14px 12px}
h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 7px;color:#352a1d}
.subtitle{font-size:.98rem;color:var(--muted);margin:0 auto;max-width:780px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:12px 14px 32px}
.stage{display:flex;justify-content:center;align-items:center;min-height:54vh;padding:8px 0 18px;perspective:1600px}
.book{position:relative;width:min(94vw,760px);min-height:460px;background:var(--paper);border-radius:4px 12px 12px 4px;box-shadow:0 18px 45px #46331f35,0 2px 6px #46331f20;overflow:hidden;transform-origin:left center;padding:clamp(24px,5vw,54px)}
.book:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,#d4c4a9,#fff8e9)}
.book.turn-next{animation:turnNext .32s ease}.book.turn-prev{animation:turnPrev .32s ease}
@keyframes turnNext{0%{transform:rotateY(0)}45%{transform:rotateY(-5deg) translateX(-3px)}100%{transform:rotateY(0)}}
@keyframes turnPrev{0%{transform:rotateY(0)}45%{transform:rotateY(5deg) translateX(3px)}100%{transform:rotateY(0)}}
.page-kicker{font:700 .76rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#967039;margin:0 0 12px}
.page-title{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.18;color:#352a1d;margin:0 0 18px}
.page-body{font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.8;white-space:pre-line}
.page-body p{margin:0 0 14px}
.verse{margin:22px 0;padding:15px 18px;border-left:3px solid var(--gold);background:#f5efe3;color:#51412c;font-style:italic;line-height:1.65}
.verse strong{display:block;font:700 .82rem system-ui,sans-serif;font-style:normal;margin-top:8px;color:#80602c}
.page-number{position:absolute;bottom:15px;right:24px;color:#9b8b73;font:.8rem system-ui,sans-serif}
.progress{height:5px;background:#d5c9b7;border-radius:9px;overflow:hidden;max-width:760px;margin:0 auto 15px}
.progress span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.status{text-align:center;font:500 .95rem system-ui,sans-serif;color:#5b5144;margin:8px 0}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:8px 0 14px}
button{border:1px solid #b8a17d;background:#fffdf7;color:#352a1d;border-radius:999px;padding:10px 15px;font-size:.95rem;cursor:pointer;box-shadow:0 2px 5px #46331f12}
button.primary{background:#6f4e27;color:white;border-color:#6f4e27}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid #d3a64d;outline-offset:2px}
.reader{max-width:760px;margin:18px auto 0;padding:15px 17px;background:#fffdf7c9;border:1px solid #d6c6ad;border-radius:12px;font-family:system-ui,sans-serif}
.reader h2{font-size:1.05rem;margin:0 0 8px}.reader p{font-size:.94rem;line-height:1.6;margin:0;white-space:pre-line}
.hint{text-align:center;font:.82rem system-ui,sans-serif;color:#756954;margin-top:10px}
@media(max-width:560px){.book{min-height:540px;padding:28px 23px 45px}.page-body{line-height:1.68}.controls button{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.book,.progress span{transition:none}.book.turn-next,.book.turn-prev{animation:none}}
</style>
</head>
<body>
<header>
<h1>História do Cristianismo</h1>
<p class="subtitle">Tiago, filho de Alfeu · Um dos doze apóstolos</p>
</header>
<main>
<div class="stage"><article class="book" id="book" aria-live="polite">
<p class="page-kicker" id="kicker"></p><h2 class="page-title" id="pageTitle"></h2><div class="page-body" id="pageBody"></div><div class="page-number" id="pageNumber"></div>
</article></div>
<div class="progress" aria-label="Progresso de leitura"><span id="progress"></span></div>
<div class="status" id="status" aria-live="polite">Página 1</div>
<div class="controls">
<button id="prev" aria-label="Página anterior">← Anterior</button>
<button id="next" class="primary" aria-label="Próxima página">Próxima →</button>
<button id="read">🔊 Ler esta página</button>
<button id="stop">⏹ Parar voz</button>
</div>
<section class="reader"><h2>Leitor de voz e texto da página</h2><p id="pageText"></p></section>
<p class="hint">Deslize para a esquerda ou direita no celular para virar as páginas. A leitura em voz alta usa a voz disponível no navegador ou aparelho.</p>
</main>
<script>
const pages = [
{
 kicker:'História do Cristianismo',
 title:'Tiago, filho de Alfeu',
 body:"Tiago, filho de Alfeu é mencionado nos Evangelhos entre os doze apóstolos escolhidos por Jesus. Embora seu nome apareça nas listas apostólicas, o Novo Testamento oferece poucas informações biográficas sobre ele.\n\nEste material reúne o que os textos bíblicos afirmam, situa Tiago entre os primeiros discípulos e distingue os dados seguros das tradições posteriores. Não devemos preencher os silêncios das Escrituras com detalhes apresentados como se fossem fatos.",
 verse:'“Tiago, filho de Alfeu.” — Mateus 10:3'
},
{
 kicker:'1. Identificação',
 title:'Quem foi Tiago, filho de Alfeu?',
 body:"Tiago, filho de Alfeu, foi um dos doze apóstolos. Seu nome aparece nas listas de Mateus, Marcos e Lucas, bem como na relação dos discípulos reunidos em Jerusalém depois da ascensão de Jesus.\n\nA expressão “filho de Alfeu” funciona como identificação familiar. Os Evangelhos não fornecem uma narrativa extensa de sua vida, de sua infância ou de sua ocupação antes do chamado.",
 verse:'Leitura: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16; Atos 1:13.'
},
{
 kicker:'2. As listas apostólicas',
 title:'Seu lugar entre os doze',
 body:"Mateus inclui Tiago, filho de Alfeu, na relação dos apóstolos. Marcos e Lucas também o mencionam. Em Atos, seu nome aparece entre os discípulos que perseveravam em oração após a ascensão de Jesus.\n\nEssas referências confirmam sua pertença ao grupo dos doze e sua presença na comunidade que aguardava o cumprimento da promessa do Pai. Ainda que os relatos sejam breves, seu nome integra o testemunho do Novo Testamento sobre a formação da Igreja.",
 verse:'Leitura: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16.'
},
{
 kicker:'3. O chamado apostólico',
 title:'Escolhido por Jesus',
 body:"Os Evangelhos apresentam os doze como homens escolhidos por Jesus para estarem com ele e serem enviados a pregar. Tiago, filho de Alfeu, aparece nesse grupo.\n\nOs textos não descrevem individualmente a conversa em que Jesus chamou Tiago, nem registram suas palavras naquele momento. Por isso, é correto afirmar que ele foi contado entre os apóstolos escolhidos, mas não reconstruir uma cena específica que a Bíblia não relata.",
 verse:'Leitura: Marcos 3:13–19; Lucas 6:12–16.'
},
{
 kicker:'4. A missão dos doze',
 title:'Enviado com os demais',
 body:"Jesus chamou os doze e lhes concedeu autoridade para participar de sua missão. Mateus 10 registra o envio dos apóstolos às ovelhas perdidas da casa de Israel, com instruções sobre a proclamação do Reino e o serviço.\n\nTiago está incluído na lista dos enviados. O texto, porém, não individualiza quais cidades visitou nem descreve acontecimentos específicos de seu ministério pessoal.",
 verse:'Leitura: Mateus 10:1–15; Marcos 6:7–13.'
},
{
 kicker:'5. Um nome compartilhado',
 title:'Não confundir os Tiagos',
 body:"O Novo Testamento menciona mais de um homem chamado Tiago. Entre eles estão Tiago, filho de Zebedeu, irmão de João, e Tiago, filho de Alfeu. Também aparece Tiago associado à liderança da igreja de Jerusalém e identificado em Gálatas como irmão do Senhor.\n\nEssas referências não devem ser automaticamente reunidas numa única biografia. A identificação de cada Tiago precisa respeitar o contexto de cada passagem.",
 verse:'Leitura: Mateus 4:21; Mateus 10:2–3; Atos 15:13; Gálatas 1:19.'
},
{
 kicker:'6. Filho de Alfeu',
 title:'O que sabemos sobre sua família?',
 body:"A informação familiar explicitamente ligada a este apóstolo é que era filho de Alfeu. A Bíblia não oferece outros dados seguros sobre seus pais, irmãos, casamento ou descendentes.\n\nAlgumas tentativas de relacioná-lo a outras pessoas chamadas Alfeu ou a outros personagens bíblicos permanecem discutidas. A prudência histórica exige não transformar hipóteses em certezas.",
 verse:'Referência: Mateus 10:3; Marcos 3:18; Lucas 6:15.'
},
{
 kicker:'7. Tiago, o Menor',
 title:'Uma identificação tradicional',
 body:"Em Marcos 15:40 aparece “Tiago, o Menor”, associado a Maria. Ao longo da história cristã, alguns intérpretes identificaram esse personagem com Tiago, filho de Alfeu. Essa associação tornou-se conhecida em parte da tradição.\n\nEntretanto, o texto bíblico não declara explicitamente que “Tiago, o Menor” seja o mesmo apóstolo filho de Alfeu. Por isso, é importante apresentar essa identificação como tradição ou hipótese, e não como informação indiscutível.",
 verse:'Leitura: Marcos 15:40; Marcos 3:18.'
},
{
 kicker:'8. Durante o ministério de Jesus',
 title:'A presença no grupo apostólico',
 body:"Os Evangelhos relatam diversas viagens, ensinamentos, curas e acontecimentos vividos pelos doze com Jesus. Tiago, filho de Alfeu, pertencia a esse círculo de discípulos.\n\nContudo, os relatos não atribuem a ele falas individuais ou ações específicas durante a maior parte do ministério público de Jesus. Sua participação é registrada sobretudo por meio das listas dos apóstolos.",
 verse:'Leitura: Lucas 6:13–16; Mateus 10:2–4.'
},
{
 kicker:'9. A paixão de Cristo',
 title:'O testemunho dos Evangelhos',
 body:"Os Evangelhos narram a prisão, o julgamento, a crucificação e a morte de Jesus. As listas apostólicas identificam Tiago como um dos doze, mas não apresentam um relato individual detalhado de sua reação durante esses acontecimentos.\n\nÉ importante não atribuir a ele diálogos ou decisões que os textos não registram. O centro do testemunho cristão é a morte de Jesus e o significado salvador que os apóstolos proclamariam.",
 verse:'Leitura: Mateus 26–27; Marcos 14–15.'
},
{
 kicker:'10. A ressurreição',
 title:'A mensagem anunciada pelos apóstolos',
 body:"A ressurreição de Jesus é o fundamento da proclamação apostólica. Paulo resume a tradição recebida sobre a morte, o sepultamento, a ressurreição e as aparições do Senhor.\n\nTiago, filho de Alfeu, não recebe uma aparição individualmente narrada nos textos bíblicos. Ainda assim, aparece no grupo dos discípulos que continuaram reunidos depois da ascensão, conforme o registro de Atos.",
 verse:'Leitura: 1 Coríntios 15:3–8; Atos 1:12–14.'
},
{
 kicker:'11. Em Jerusalém',
 title:'Perseverando em oração',
 body:"Atos 1 apresenta os discípulos reunidos em Jerusalém, perseverando unanimemente em oração. A lista inclui os onze apóstolos, entre eles Tiago, filho de Alfeu.\n\nEssa referência é especialmente importante porque situa Tiago na comunidade apostólica depois da ascensão de Jesus e antes do Pentecostes. O texto não descreve o restante de sua trajetória em detalhes.",
 verse:'Leitura: Atos 1:12–14.'
},
{
 kicker:'12. O Pentecostes e a Igreja',
 title:'O contexto da missão',
 body:"Atos 2 descreve a descida do Espírito Santo no dia de Pentecostes e o início da proclamação pública dos discípulos em Jerusalém. Tiago, filho de Alfeu, não é destacado individualmente no episódio, mas fazia parte do grupo apostólico mencionado anteriormente.\n\nA Igreja nasce em seu testemunho público como comunidade que anuncia Jesus crucificado e ressuscitado, chama ao arrependimento e vive na comunhão e no ensino dos apóstolos.",
 verse:'Leitura: Atos 2:1–42.'
},
{
 kicker:'13. Tradições posteriores',
 title:'O que a história preservou',
 body:"Tradições cristãs posteriores atribuem a diferentes apóstolos viagens missionárias, martírios e locais de sepultamento. No caso de Tiago, filho de Alfeu, os relatos não são uniformes e muitas vezes se confundem com histórias de outros homens chamados Tiago.\n\nComo o Novo Testamento não registra de forma clara o destino final desse apóstolo, afirmações detalhadas sobre onde pregou ou como morreu devem ser apresentadas com cautela e atribuídas às tradições que as preservaram.",
 verse:'Distinção importante: relato bíblico e tradição eclesiástica não possuem o mesmo grau de evidência.'
},
{
 kicker:'14. O valor do testemunho',
 title:'Fidelidade sem destaque público',
 body:"A brevidade das referências a Tiago não significa que sua participação tenha sido irrelevante. Ele foi contado entre os doze escolhidos por Jesus e permaneceu ligado à comunidade apostólica.\n\nNem todos os servos de Deus aparecem nas Escrituras com longos discursos ou narrativas pessoais. A importância do discipulado não depende da quantidade de registros sobre uma pessoa, mas da fidelidade ao chamado de Cristo.",
 verse:'Reflexão: Marcos 3:13–19; Atos 1:13–14.'
},
{
 kicker:'15. Lições para a Igreja',
 title:'O que podemos aprender?',
 body:"1. Jesus chama pessoas para fazer parte de sua missão.\n\n2. A obra de Deus não depende de reconhecimento público ou destaque individual.\n\n3. A leitura bíblica responsável distingue o que está escrito das hipóteses e tradições posteriores.\n\n4. A perseverança em oração e comunhão marcou a comunidade dos primeiros discípulos.\n\n5. Cada membro do corpo de Cristo tem valor, mesmo quando sua história não é amplamente conhecida.",
 verse:'Leitura: 1 Coríntios 12:12–27; Atos 1:14.'
},
{
 kicker:'16. Síntese e referências',
 title:'O que podemos afirmar com segurança',
 body:"Tiago, filho de Alfeu, foi um dos doze apóstolos escolhidos por Jesus. Seu nome aparece nas listas apostólicas e entre os discípulos reunidos em Jerusalém depois da ascensão. O Novo Testamento não oferece uma biografia extensa nem informa claramente os detalhes de sua morte.\n\nPara aprofundar o estudo, leia as listas dos doze em Mateus 10, Marcos 3 e Lucas 6, e observe sua presença em Atos 1:13. Ao estudar tradições posteriores, identifique sempre sua origem e seu grau de certeza.",
 verse:'Referências principais: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16; Atos 1:13–14; Marcos 15:40.'
}
];

let current = 0;
const $ = id => document.getElementById(id);
const book = $("book");
function render(){
  const p = pages[current];
  $("kicker").textContent = p.kicker;
  $("pageTitle").textContent = p.title;
  $("pageBody").textContent = p.body;
  const quote = document.createElement("div");
  quote.className = "verse";
  quote.textContent = p.verse;
  $("pageBody").appendChild(quote);
  $("pageNumber").textContent = `${current+1} / ${pages.length}`;
  $("status").textContent = `Página ${current+1} de ${pages.length}`;
  $("progress").style.width = `${((current+1)/pages.length)*100}%`;
  $("pageText").textContent = `${p.title}\n\n${p.body}\n\n${p.verse}`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === pages.length-1;
}
function go(step){
  const next = current + step;
  if(next < 0 || next >= pages.length) return;
  current = next;
  book.classList.remove("turn-next","turn-prev");
  void book.offsetWidth;
  book.classList.add(step > 0 ? "turn-next" : "turn-prev");
  render();
}
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("read").addEventListener("click",()=>{
  if(!("speechSynthesis" in window)){alert("A leitura em voz alta não está disponível neste navegador.");return;}
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance($("pageText").textContent);
  utterance.lang = "pt-BR";
  utterance.rate = 0.94;
  speechSynthesis.speak(utterance);
});
$("stop").addEventListener("click",()=>{if("speechSynthesis" in window) speechSynthesis.cancel();});
let startX = 0;
book.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX;},{passive:true});
book.addEventListener("touchend",e=>{
  const diff=e.changedTouches[0].screenX-startX;
  if(Math.abs(diff)>55) go(diff<0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
render();
</script>
</body>
</html>
