<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="André, apóstolo: vida, chamado, ministério e importância na história do cristianismo, à luz do Novo Testamento.">
<title>Flipbook — História do Cristianismo: André, apóstolo</title>
<style>
:root{--ink:#29251f;--gold:#b58a42;--paper:#fffdf7;--bg:#e9e3d8;--muted:#6b5b46}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f5f1e8,#ddd4c5);font-family:Georgia,"Times New Roman",serif;color:var(--ink);min-height:100vh}
header{text-align:center;padding:24px 14px 12px}
h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 7px;color:#352a1d}
.subtitle{font-size:.98rem;color:var(--muted);margin:0 auto;max-width:780px;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:12px 14px 32px}
.stage{display:flex;justify-content:center;align-items:center;min-height:54vh;padding:8px 0 18px;perspective:1600px}
.book{position:relative;width:min(94vw,760px);min-height:460px;background:var(--paper);border-radius:4px 12px 12px 4px;box-shadow:0 18px 45px #46331f35,0 2px 6px #46331f20;overflow:hidden;transform-origin:left center;padding:clamp(24px,5vw,54px)}
.book:before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,#d4c4a9,#fff8e9)}
.book.turn-next{animation:turnNext .32s ease}.book.turn-prev{animation:turnPrev .32s ease}
@keyframes turnNext{0%{transform:rotateY(0)}45%{transform:rotateY(-5deg) translateX(-3px)}100%{transform:rotateY(0)}}
@keyframes turnPrev{0%{transform:rotateY(0)}45%{transform:rotateY(5deg) translateX(3px)}100%{transform:rotateY(0)}}
.page-kicker{font:700 .76rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#967039;margin:0 0 12px}
.page-title{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.18;color:#352a1d;margin:0 0 18px}
.page-body{font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.8;white-space:pre-line}
.page-body p{margin:0 0 14px}
.verse{margin:22px 0;padding:15px 18px;border-left:3px solid var(--gold);background:#f5efe3;color:#51412c;font-style:italic;line-height:1.65}
.verse strong{display:block;font:700 .82rem system-ui,sans-serif;font-style:normal;margin-top:8px;color:#80602c}
.page-number{position:absolute;bottom:15px;right:24px;color:#9b8b73;font:.8rem system-ui,sans-serif}
.progress{height:5px;background:#d5c9b7;border-radius:9px;overflow:hidden;max-width:760px;margin:0 auto 15px}
.progress span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.status{text-align:center;font:500 .95rem system-ui,sans-serif;color:#5b5144;margin:8px 0}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:8px 0 14px}
button{border:1px solid #b8a17d;background:#fffdf7;color:#352a1d;border-radius:999px;padding:10px 15px;font-size:.95rem;cursor:pointer;box-shadow:0 2px 5px #46331f12}
button.primary{background:#6f4e27;color:white;border-color:#6f4e27}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid #d3a64d;outline-offset:2px}
.reader{max-width:760px;margin:18px auto 0;padding:15px 17px;background:#fffdf7c9;border:1px solid #d6c6ad;border-radius:12px;font-family:system-ui,sans-serif}
.reader h2{font-size:1.05rem;margin:0 0 8px}.reader p{font-size:.94rem;line-height:1.6;margin:0;white-space:pre-line}
.hint{text-align:center;font:.82rem system-ui,sans-serif;color:#756954;margin-top:10px}
@media(max-width:560px){.book{min-height:540px;padding:28px 23px 45px}.page-body{line-height:1.68}.controls button{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){.book,.progress span{transition:none}.book.turn-next,.book.turn-prev{animation:none}}
</style>
</head>
<body>
<header>
<h1>História do Cristianismo</h1>
<p class="subtitle">André, apóstolo · Um dos primeiros discípulos de Jesus</p>
</header>
<main>
<div class="stage"><article class="book" id="book" aria-live="polite">
<p class="page-kicker" id="kicker"></p><h2 class="page-title" id="pageTitle"></h2><div class="page-body" id="pageBody"></div><div class="page-number" id="pageNumber"></div>
</article></div>
<div class="progress" aria-label="Progresso de leitura"><span id="progress"></span></div>
<div class="status" id="status" aria-live="polite">Página 1</div>
<div class="controls">
<button id="prev" aria-label="Página anterior">← Anterior</button>
<button id="next" class="primary" aria-label="Próxima página">Próxima →</button>
<button id="read">🔊 Ler esta página</button>
<button id="stop">⏹ Parar voz</button>
</div>
<section class="reader"><h2>Leitor de voz e texto da página</h2><p id="pageText"></p></section>
<p class="hint">Deslize para a esquerda ou direita no celular para virar as páginas. A leitura em voz alta usa a voz disponível no navegador ou aparelho.</p>
</main>
<script>
const pages = [
{
kicker:"História do Cristianismo",
title:"André, apóstolo",
body:`André foi um dos primeiros discípulos chamados por Jesus e irmão de Simão Pedro. Os Evangelhos o apresentam como pescador da Galileia e como alguém que, depois de encontrar Jesus, levou outras pessoas até ele.

Embora apareça menos frequentemente do que Pedro nos relatos bíblicos, André tem um papel significativo: ele responde ao chamado de Jesus, compartilha a descoberta com seu irmão e participa do grupo dos Doze apóstolos.

Sua história convida a reconhecer o valor de um testemunho que conduz outras pessoas a Cristo, mesmo quando aquele que testemunha não ocupa o centro das narrativas.`,
verse:"“Havemos achado o Messias (que, traduzido, é o Cristo).” — João 1:41"
},
{
kicker:"1. Identificação e contexto",
title:"Quem foi André?",
body:`André era irmão de Simão Pedro e filho de João, também chamado Jonas em algumas traduções e passagens relacionadas à família de Pedro. Ele vivia na região da Galileia e trabalhava como pescador.

Os Evangelhos o incluem entre os primeiros seguidores de Jesus e, posteriormente, entre os doze apóstolos. Seu nome aparece em listas apostólicas e em episódios específicos do ministério de Cristo.

A Bíblia não informa a data de nascimento de André nem oferece uma biografia completa de sua vida. Por isso, os acontecimentos mais seguros para reconstruir sua trajetória são aqueles preservados no Novo Testamento.`,
verse:"Leitura principal: Mateus 4:18–20; Marcos 1:16–18; João 1:35–42."
},
{
kicker:"2. Antes de seguir Jesus",
title:"Um discípulo de João Batista",
body:`O Evangelho de João relata que André estava entre os discípulos de João Batista. Quando João Batista apontou Jesus como o Cordeiro de Deus, André e outro discípulo foram atrás de Jesus e passaram algum tempo com ele.

Esse episódio mostra que André já estava envolvido na expectativa pela vinda daquele que Deus enviaria. Ao ouvir o testemunho de João Batista, ele se aproximou de Jesus e procurou conhecê-lo.

O texto identifica nominalmente André, mas não revela o nome do outro discípulo nesse trecho. É importante manter essa distinção ao apresentar o relato.`,
verse:"Leitura: João 1:35–40."
},
{
kicker:"3. André encontra o Messias",
title:"Ele leva Pedro até Jesus",
body:`Depois de encontrar Jesus, André procurou seu irmão Simão e lhe anunciou que haviam encontrado o Messias. Em seguida, levou Simão até Jesus.

Esse pequeno episódio é um dos retratos mais marcantes de André nos Evangelhos. Ele não guardou para si a descoberta: compartilhou a notícia com alguém próximo e o conduziu ao encontro com Jesus.

O texto não diz que André compreendeu naquele instante todos os aspectos da missão de Cristo. Mostra, porém, que ele reconheceu a importância daquele encontro e tomou a iniciativa de contar ao irmão.`,
verse:"“E levou-o a Jesus.” — João 1:42"
},
{
kicker:"4. O chamado junto ao mar",
title:"De pescador a apóstolo",
body:`Mateus e Marcos relatam que Jesus chamou André e Simão enquanto eles trabalhavam como pescadores no mar da Galileia. Jesus os convidou a segui-lo e prometeu fazer deles pescadores de homens.

Os dois deixaram as redes e passaram a acompanhar Jesus. O chamado marcou uma mudança de direção: sua vida seria dedicada à missão do Mestre.

Os Evangelhos apresentam esse momento de forma breve e não fornecem todos os detalhes sobre as decisões familiares ou profissionais envolvidas. O foco da narrativa está na autoridade do chamado de Jesus e na resposta dos discípulos.`,
verse:"“Vinde após mim, e eu vos farei pescadores de homens.” — Mateus 4:19"
},
{
kicker:"5. André entre os Doze",
title:"Um dos apóstolos escolhidos",
body:`André foi escolhido por Jesus para integrar o grupo dos doze apóstolos. Seu nome aparece nas listas de Mateus, Marcos, Lucas e Atos, embora a ordem dos nomes varie entre elas.

Como os demais apóstolos, André foi chamado a acompanhar Jesus e a participar da missão de anunciar o Reino de Deus. Os Evangelhos não registram todas as suas atividades individuais, por isso não é possível reconstruir cada etapa de seu ministério.

A ausência de muitos detalhes não significa que sua participação fosse irrelevante. Ela apenas mostra os limites das informações preservadas nos textos bíblicos.`,
verse:"Leitura: Mateus 10:2–4; Marcos 3:16–19; Lucas 6:13–16; Atos 1:13."
},
{
kicker:"6. A multiplicação dos pães",
title:"André apresenta um menino",
body:`No Evangelho de João, quando uma grande multidão precisava ser alimentada, André chamou a atenção de Jesus para um menino que tinha cinco pães de cevada e dois peixinhos.

André também observou a limitação dos recursos diante do tamanho da multidão. Jesus, porém, tomou os alimentos e realizou o sinal da multiplicação, alimentando as pessoas presentes.

O episódio revela André como alguém que percebe uma possibilidade e a apresenta a Jesus, mesmo reconhecendo que os recursos pareciam insuficientes. O centro do relato continua sendo a ação de Cristo.`,
verse:"Leitura: João 6:1–13."
},
{
kicker:"7. Alguns gregos procuram Jesus",
title:"André participa do encontro",
body:`João registra que alguns gregos que haviam ido a Jerusalém para a festa procuraram Filipe e disseram que desejavam ver Jesus. Filipe falou com André, e os dois levaram o pedido a Jesus.

Esse episódio mostra André novamente participando de uma aproximação entre pessoas e Jesus. O texto não detalha a conversa completa entre os discípulos e os visitantes, mas registra que o pedido chegou ao conhecimento do Mestre.

A passagem ocorre num momento em que Jesus fala sobre sua hora e sobre o significado de sua morte. Assim, o encontro aponta para a abrangência da missão de Cristo, que ultrapassaria as fronteiras de um único povo.`,
verse:"Leitura: João 12:20–26."
},
{
kicker:"8. André pergunta a Jesus",
title:"O discurso sobre o futuro",
body:`No Evangelho de Marcos, André aparece entre os quatro discípulos que, em particular, perguntam a Jesus sobre a destruição do templo e os acontecimentos futuros. Os outros são Pedro, Tiago e João.

Jesus responde com ensinamentos sobre vigilância, perseverança e a necessidade de não se deixar enganar. O texto não apresenta André como autor de uma interpretação independente; ele está entre os discípulos que escutam a instrução de Jesus.

A passagem deve ser lida com atenção ao contexto e às diferentes interpretações cristãs sobre os acontecimentos anunciados. O ponto explícito é o chamado de Jesus à vigilância e à fidelidade.`,
verse:"Leitura: Marcos 13:3–13, 32–37."
},
{
kicker:"9. André nos relatos da paixão",
title:"O que os Evangelhos registram",
body:`Os Evangelhos não dão a André um papel individual destacado nas cenas da crucificação e do sepultamento de Jesus. As narrativas concentram-se nos acontecimentos centrais da paixão e mencionam diferentes discípulos e testemunhas.

Por isso, não é correto afirmar detalhes específicos sobre a presença ou as ações de André nesses momentos quando o texto não os declara. A abordagem histórica responsável distingue o que é informado diretamente das hipóteses ou tradições posteriores.

O que os relatos deixam claro é que André pertenceu ao grupo apostólico formado por Jesus e que sua importância está ligada ao testemunho preservado ao longo do Novo Testamento.`,
verse:"Para contexto: Marcos 14–16; João 18–20."
},
{
kicker:"10. Depois da ressurreição",
title:"André na comunidade apostólica",
body:`Depois da ascensão de Jesus, Atos dos Apóstolos menciona André entre os apóstolos que se reuniram em Jerusalém com outros discípulos e com as mulheres que acompanhavam a comunidade.

A referência é breve, mas confirma sua presença no grupo apostólico no período inicial da Igreja. O livro de Atos descreve a comunidade perseverando em oração enquanto aguardava o cumprimento da promessa do Espírito Santo.

A Bíblia não apresenta uma narrativa detalhada das viagens missionárias de André após esse momento. Informações sobre destinos específicos devem ser identificadas como tradições históricas, não como fatos relatados diretamente em Atos.`,
verse:"Leitura: Atos 1:12–14."
},
{
kicker:"11. Tradições sobre seu ministério",
title:"Bíblia e memória cristã",
body:`Em séculos posteriores, diferentes tradições cristãs associaram André à pregação do evangelho em regiões ao redor do mar Negro, na Grécia e em outras áreas. Essas tradições contribuíram para a devoção e a memória de sua figura em várias igrejas.

Entretanto, o Novo Testamento não oferece um itinerário completo de suas viagens nem descreve diretamente todos os episódios atribuídos a ele em relatos posteriores. As narrativas sobre seu martírio também pertencem à tradição cristã antiga e posterior, com detalhes que variam conforme as fontes.

Ao estudar André, é importante valorizar a memória histórica sem apresentar como certeza bíblica aquilo que provém de tradições posteriores.`,
verse:"Referências bíblicas principais sobre André: João 1:35–42; 6:5–9; 12:20–22; Marcos 13:3; Atos 1:13."
},
{
kicker:"12. André na história do cristianismo",
title:"Um apóstolo lembrado por muitas igrejas",
body:`André é venerado em diversas tradições cristãs. É especialmente associado à Igreja Ortodoxa e é considerado padroeiro da Escócia; também ocupa lugar importante na memória cristã da Grécia e de outras comunidades.

Essas associações refletem a longa história de culto, arte, liturgia e tradição ligada ao apóstolo. Elas não devem ser confundidas com dados biográficos detalhados fornecidos pelos Evangelhos, mas ajudam a compreender a influência de sua memória ao longo dos séculos.

Apesar das diferenças entre as tradições, sua presença no Novo Testamento permanece o ponto de partida mais sólido para compreender sua contribuição à história cristã.`,
verse:"Leitura complementar: João 1:40–42; Mateus 10:2–4; Atos 1:13."
},
{
kicker:"13. Lições para a vida cristã",
title:"O que aprendemos com André?",
body:`1. Ouvir o testemunho: André aproximou-se de Jesus após ouvir João Batista.
2. Compartilhar a descoberta: procurou seu irmão Simão e o levou até Jesus.
3. Servir com simplicidade: aparece em episódios concretos, sem buscar destaque pessoal.
4. Apresentar o que se tem: levou a Jesus a informação sobre os pães e os peixes.
5. Permanecer na comunidade: aparece entre os apóstolos reunidos em Jerusalém.

Essas lições devem ser extraídas dos relatos bíblicos sem atribuir a André palavras ou acontecimentos que as Escrituras não registram. Seu exemplo aponta para a importância de conduzir pessoas a Cristo e permanecer fiel à missão recebida.`,
verse:"Leitura: João 1:35–42; João 6:8–9; Atos 1:13–14."
},
{
kicker:"14. Cronologia e referências",
title:"Percurso bíblico de André",
body:`• Discípulo de João Batista e seguidor de Jesus: João 1:35–40.
• Anuncia o Messias a Simão e o leva a Jesus: João 1:41–42.
• Chamado junto ao mar da Galileia: Mateus 4:18–20; Marcos 1:16–18.
• Incluído entre os Doze apóstolos: Mateus 10:2–4; Lucas 6:13–16.
• Apresenta a Jesus o menino com pães e peixes: João 6:8–9.
• Participa do pedido dos gregos que queriam ver Jesus: João 12:20–22.
• Presente entre os apóstolos que perguntam sobre o templo: Marcos 13:3.
• Reunido com os apóstolos em Jerusalém: Atos 1:13–14.

Os Evangelhos e Atos não informam as datas exatas de nascimento e morte de André. Os relatos sobre suas viagens e seu martírio vêm de tradições posteriores.`,
verse:"Fonte principal: Novo Testamento."
},
{
kicker:"Encerramento",
title:"Um testemunho que conduz a Cristo",
body:`André, apóstolo, é lembrado como um dos primeiros seguidores de Jesus e como o irmão que levou Simão Pedro até o Messias. Os episódios em que aparece são breves, mas mostram sua disposição de responder ao chamado e compartilhar com outras pessoas aquilo que havia descoberto.

Ele também participa de momentos importantes do ministério de Jesus, como a alimentação da multidão e o encontro com pessoas que desejavam vê-lo. Depois da ressurreição, permanece entre os apóstolos reunidos em Jerusalém.

Sua história ensina que o valor do serviço cristão não depende de ocupar sempre o primeiro plano. André aponta para Jesus e nos recorda a importância de testemunhar com fidelidade, humildade e responsabilidade histórica.`,
verse:"“Havemos achado o Messias.” — João 1:41"
}
];

let current = 0;
const $ = id => document.getElementById(id);
const book = $("book");
function render(){
  const p = pages[current];
  $("kicker").textContent = p.kicker;
  $("pageTitle").textContent = p.title;
  $("pageBody").textContent = p.body;
  const quote = document.createElement("div");
  quote.className = "verse";
  quote.textContent = p.verse;
  $("pageBody").appendChild(quote);
  $("pageNumber").textContent = `${current+1} / ${pages.length}`;
  $("status").textContent = `Página ${current+1} de ${pages.length}`;
  $("progress").style.width = `${((current+1)/pages.length)*100}%`;
  $("pageText").textContent = `${p.title}\n\n${p.body}\n\n${p.verse}`;
  $("prev").disabled = current === 0;
  $("next").disabled = current === pages.length-1;
}
function go(step){
  const next = current + step;
  if(next < 0 || next >= pages.length) return;
  current = next;
  book.classList.remove("turn-next","turn-prev");
  void book.offsetWidth;
  book.classList.add(step > 0 ? "turn-next" : "turn-prev");
  render();
}
$("prev").addEventListener("click",()=>go(-1));
$("next").addEventListener("click",()=>go(1));
$("read").addEventListener("click",()=>{
  if(!("speechSynthesis" in window)){alert("A leitura em voz alta não está disponível neste navegador.");return;}
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance($("pageText").textContent);
  utterance.lang = "pt-BR";
  utterance.rate = 0.94;
  speechSynthesis.speak(utterance);
});
$("stop").addEventListener("click",()=>{if("speechSynthesis" in window) speechSynthesis.cancel();});
let startX = 0;
book.addEventListener("touchstart",e=>{startX=e.changedTouches[0].screenX;},{passive:true});
book.addEventListener("touchend",e=>{
  const diff=e.changedTouches[0].screenX-startX;
  if(Math.abs(diff)>55) go(diff<0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
render();
</script>
</body>
</html>
